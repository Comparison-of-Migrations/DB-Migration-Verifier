function sampleTiming(){const original=document.getElementById('ko-primary-normal');const cell=original.closest('.cell').cloneNode(true);cell.style.left='500px';cell.style.top='50px';const b=cell.querySelector('button');b.id='timing-helper';document.body.append(cell);getComputedStyle(b).backgroundColor;b.classList.add('fixture-over');getComputedStyle(b).backgroundColor;let a=b.getAnimations().find(x=>x.transitionProperty==='background-color');if(!a)throw Error('No source color transition');a.pause();const samples=[];for(const time of [0,15.125,40.125,75.375,105.625,120,121]){a.currentTime=time;samples.push({time,color:getComputedStyle(b).backgroundColor});}a.cancel();b.classList.remove('fixture-over');getComputedStyle(b).backgroundColor;for(const anim of b.getAnimations())anim.finish();b.classList.add('fixture-over');getComputedStyle(b).backgroundColor;a=b.getAnimations().find(x=>x.transitionProperty==='background-color');a.pause();a.currentTime=40.125;getComputedStyle(b).backgroundColor;b.classList.remove('fixture-over');getComputedStyle(b).backgroundColor;a=b.getAnimations().find(x=>x.transitionProperty==='background-color');if(!a)throw Error('No source reverse transition');const reversedDuration=a.effect.getTiming().duration;a.pause();const reversed=[];for(const time of [0,15.125,30.375,60.625,90.875,120]){a.currentTime=time;reversed.push({time,color:getComputedStyle(b).backgroundColor});}cell.remove();return {samples,reversedDuration,reversed};}
async function recordStates(){let result=[];for(const original of document.querySelectorAll('button.btn[id]')){for(const mode of ['normal','hover','pressed','focus']){if(original.disabled&&mode==='focus')continue;const cell=original.closest('.cell').cloneNode(true);cell.style.left='500px';cell.style.top='50px';const b=cell.querySelector('button');b.id='state-helper';document.body.append(cell);if(mode==='hover'||mode==='pressed')b.classList.add('fixture-over');if(mode==='pressed')b.classList.add('fixture-active');if(mode==='focus')b.classList.add('fixture-focus');getComputedStyle(b).backgroundColor;for(const a of b.getAnimations()){if(a instanceof CSSTransition)a.finish();}const s=getComputedStyle(b);result.push({id:original.id,mode,bg:s.backgroundColor,color:s.color,border:s.borderColor,shadow:s.boxShadow,transform:s.transform,outline:s.outline,offset:s.outlineOffset});cell.remove();}}document.getElementById('record-states').textContent='ActionButton states recorded';const response=await fetch('/evidence/source-action-button-states.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dpr:devicePixelRatio,result,timing:sampleTiming(),tracks:sampleTracks()})});if(!response.ok)throw Error('Fixture evidence failed');}
