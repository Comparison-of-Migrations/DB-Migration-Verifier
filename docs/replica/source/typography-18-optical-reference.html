<!doctype html><meta charset="utf-8"><title>Source text wrapping boundary isolation</title><style>body{margin:0;background:#313338;color:#f2f3f5}#atlas{display:grid;grid-template-columns:500px 500px;width:1000px}.cell{height:130px;padding:10px;box-sizing:border-box}.text{white-space:normal;margin:0}pre{white-space:pre-wrap}</style><div id="atlas"><div class="cell"><div class="text" data-id="auto" style='font:700 18px/27px system-ui;letter-spacing:-.27px;width:480px;'>Source DB</div></div><div class="cell"><div class="text" data-id="none" style='font:700 18px/27px system-ui;letter-spacing:-.27px;width:480px;font-optical-sizing:none;'>Source DB</div></div><div class="cell"><div class="text" data-id="axis18" style='font:700 18px/27px system-ui;letter-spacing:-.27px;width:480px;font-variation-settings:"opsz" 18;'>Source DB</div></div><div class="cell"><div class="text" data-id="axis36" style='font:700 18px/27px system-ui;letter-spacing:-.27px;width:480px;font-variation-settings:"opsz" 36;'>Source DB</div></div></div><pre id="metrics"></pre><script>
const measured=Array.from(document.querySelectorAll('.text')).map(el=>{const b=el.getBoundingClientRect(),t=el.firstChild,groups=new Map();for(let i=0;i<t.length;i++){const r=document.createRange();r.setStart(t,i);r.setEnd(t,i+1);const rect=r.getBoundingClientRect();if(rect.width===0)continue;const key=rect.y.toFixed(4);if(!groups.has(key))groups.set(key,{y:rect.y,left:rect.left,right:rect.right,text:''});const g=groups.get(key);g.left=Math.min(g.left,rect.left);g.right=Math.max(g.right,rect.right);g.text+=t.textContent[i];}const canvas=document.createElement("canvas"),ctx=canvas.getContext("2d"),style=getComputedStyle(el);ctx.font=style.font;ctx.letterSpacing=style.letterSpacing;return {canvasWidth:ctx.measureText(t.textContent).width,id:el.dataset.id,height:b.height,width:b.width,lines:Array.from(groups.values()).map(g=>({text:g.text,width:g.right-g.left}))};});document.querySelector('#metrics').textContent=JSON.stringify(measured,null,2);
</script>
