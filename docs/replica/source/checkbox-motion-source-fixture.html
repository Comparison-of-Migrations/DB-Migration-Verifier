<!doctype html><meta charset="utf-8"><title>Checkbox motion · original isolation</title><link rel="stylesheet" href="checkbox-state.css"><button id="record">Record Checkbox motion</button><div id="fixture" style="padding:30px"></div><script>
const scenarios=[['check','unchecked','checked',false,false],['mixed','unchecked','mixed',false,false],['mixed-check','mixed','checked',false,false],['uncheck','checked','unchecked',false,false],['hover','checked','checked',true,false],['pressed','checked','checked',false,true]];
const times=[0,0.5,15.125,40.125,75.375,80,105.625,120,160];
function apply(el,state,hover,pressed){el.checked=state==='checked';el.indeterminate=state==='mixed';el.classList.toggle('diag-hover',hover);el.classList.toggle('diag-active',pressed)}
function read(el){const s=getComputedStyle(el),a=getComputedStyle(el,'::after');return {bg:s.backgroundColor,border:s.borderColor,shadow:s.boxShadow,scale:s.transform,mark:a.transform}}
function prepare(from,to,hover,pressed){const el=document.createElement('input');el.type='checkbox';apply(el,from,false,false);fixture.append(el);read(el);apply(el,to,hover,pressed);read(el);const animations=el.getAnimations({subtree:true});for(const a of animations)a.pause();return {el,animations}}
record.onclick=async()=>{const output=[];for(const [name,from,to,hover,pressed]of scenarios){let samples=[];for(const t of times){const p=prepare(from,to,hover,pressed);for(const a of p.animations)a.currentTime=t;samples.push({time:t,...read(p.el)});p.el.remove()}
let reversed=[];let durations=[];for(const t of times){const p=prepare(from,to,hover,pressed);for(const a of p.animations)a.currentTime=40.125;read(p.el);apply(p.el,from,false,false);read(p.el);const back=p.el.getAnimations({subtree:true});for(const a of back){a.pause();a.currentTime=t}if(t===0)durations=back.map(a=>({property:a.transitionProperty,pseudo:a.effect.pseudoElement,duration:a.effect.getComputedTiming().duration}));reversed.push({time:t,...read(p.el)});p.el.remove()}output.push({name,samples,reversed,durations})}await fetch('/evidence/source-checkbox-motion.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dpr:devicePixelRatio,output})});record.textContent='Checkbox motion recorded'};
</script>
