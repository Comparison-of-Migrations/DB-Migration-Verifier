<!doctype html><meta charset="utf-8"><title>Radio · original isolation</title><link rel="stylesheet" href="radio-state.css"><style>body{margin:0;background:#313338}.fixture{width:480px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(12,52px);grid-template-columns:repeat(2,240px)}.fixture-row{width:240px;height:52px;display:flex;align-items:center;padding-left:30px;gap:28px}.fixture-row span{font-size:12px;color:#b5bac1}input[type=radio]{transition:none!important}input[type=radio]::after{transition:none!important}#record{position:fixed;right:18px;top:18px}</style><button id="record">Windows radio record</button><div class="fixture" id="fixture"></div><script>
fetch('radio-cases.json').then(r=>r.json()).then(cases=>{for(const c of cases){const row=document.createElement('div');row.className='fixture-row';const input=document.createElement('input');input.type='radio';input.name=c.id;input.dataset.id=c.id;input.setAttribute('aria-label',c.id);input.checked=c.state==='checked';input.indeterminate=c.state==='mixed';input.disabled=c.disabled;if(c.hover)input.classList.add('diag-hover');if(c.pressed)input.classList.add('diag-active');if(c.focused)input.classList.add('diag-focus');if(c.focusVisible)input.classList.add('diag-visible');const span=document.createElement('span');span.textContent=c.id;row.append(input,span);fixture.append(row)}document.getElementById('record').onclick=async()=>{const rows=[...document.querySelectorAll('input')].map(el=>{const s=getComputedStyle(el),a=getComputedStyle(el,'::after'),r=el.getBoundingClientRect();return {id:el.dataset.id,checked:el.checked,indeterminate:el.indeterminate,disabled:el.disabled,rect:{x:r.x,y:r.y,width:r.width,height:r.height},background:s.backgroundColor,border:s.borderColor,borderWidth:s.borderWidth,radius:s.borderRadius,shadow:s.boxShadow,outline:s.outline,outlineOffset:s.outlineOffset,transform:s.transform,transition:s.transition,after:{width:a.width,height:a.height,boxSizing:a.boxSizing,origin:a.transformOrigin,transform:a.transform,border:a.borderWidth,background:a.backgroundColor,marginTop:a.marginTop}}});window.radioRecord={dpr:devicePixelRatio,rows};await fetch('/evidence/source-radio.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(window.radioRecord)});document.getElementById('record').textContent='Radio recorded'};});</script>
