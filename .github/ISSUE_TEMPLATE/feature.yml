name: Feature request
description: Describe an unmet database comparison need
title: "[Feature] "
body:
  - type: textarea
    id: need
    attributes:
      label: Problem to solve
      description: Describe the user task, DB engine, and expected observable result.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Include a minimal example and explain how completion could be verified.
